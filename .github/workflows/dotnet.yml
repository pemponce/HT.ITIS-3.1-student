name: .NET

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup dotnet
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build in Debug mode
        run: dotnet build --no-restore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Prepare Minio image
        run: |
          docker pull scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
          docker tag scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z minio/minio:latest
      - name: Build in Debug mode
        run: dotnet build
      - name: Tests
        run: dotnet test --no-build
        working-directory: Dotnet.Homeworks.Tests