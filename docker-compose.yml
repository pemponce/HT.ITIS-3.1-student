version: '3.8'
services:
  dotnet_postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: homeworks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  dotnet_rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      # guest/guest намеренно заменён на свои данные
      RABBITMQ_DEFAULT_USER: homeworks_user
      RABBITMQ_DEFAULT_PASS: homeworks_pass_42
    ports:
      - "5672:5672"
      - "15672:15672"

#    
#  dotnet_minio:
#    image: minio/minio:latest
#    
#  dotnet_mongodb:
#    image: mongo:latest
#    
#  dotnet_jaeger:
#    image: jaegertracing/all-in-one:latest
#    
  dotnet_main:
    build:
      context: .
      dockerfile: Dotnet.Homeworks.MainProject/Dockerfile
    depends_on:
      - dotnet_postgres
    restart: on-failure
    environment:
      ConnectionStrings__Default: "Host=dotnet_postgres;Port=5432;Database=homeworks;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "8080:80"

  dotnet_mailing:
    build:
      context: .
      dockerfile: Dotnet.Homeworks.Mailing.API/Dockerfile
    depends_on:
      - dotnet_rabbitmq
    restart: on-failure
    environment:
      RabbitMqConfig__Hostname: "dotnet_rabbitmq"
      RabbitMqConfig__Username: "homeworks_user"
      RabbitMqConfig__Password: "homeworks_pass_42"
      EmailConfig__Email: "${EMAIL_ADDRESS:-}"
      EmailConfig__Host: "smtp.gmail.com"
      EmailConfig__Port: "587"
      EmailConfig__Password: "${EMAIL_PASSWORD:-}"
